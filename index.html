<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YouTuber Life 3D – Mega Life Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#07111f;color:#fff}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;left:10px;right:10px;top:10px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.stat{background:rgba(7,12,24,.82);border:1px solid #2e4b70;border-radius:12px;padding:7px 10px;font-size:12px;box-shadow:0 5px 18px #0005}
#menu{position:fixed;left:10px;bottom:10px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
button,select,input{font:inherit}
button{border:0;border-radius:10px;padding:9px 11px;background:#1c3658;color:#fff;cursor:pointer}
button:hover{background:#28527f}button.good{background:#176b46}button.warn{background:#72521b}button.red{background:#71303a}
#panel{position:fixed;z-index:20;top:55px;right:10px;width:min(430px,calc(100% - 20px));max-height:calc(100% - 120px);overflow:auto;background:rgba(5,11,22,.96);border:1px solid #34567e;border-radius:16px;padding:15px;display:none;box-shadow:0 15px 50px #000b}
#panel.show{display:block}.row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.row>*{flex:1;min-width:100px}
input,select{background:#0d1b2d;color:#fff;border:1px solid #385474;border-radius:8px;padding:8px}
h2,h3{margin:5px 0 10px}.card{background:#0d1a2a;border:1px solid #25425f;border-radius:11px;padding:10px;margin:8px 0}
.small{font-size:12px;color:#b9c8d9}.close{float:right}
#toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:50;background:#101d2e;border:1px solid #4e78a5;border-radius:12px;padding:10px 15px;display:none}
#record{position:fixed;left:50%;top:75px;transform:translateX(-50%);z-index:15;background:#9c1d2c;border-radius:20px;padding:7px 14px;display:none;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06);opacity:.65}}
#help{position:fixed;left:10px;top:58px;z-index:4;background:#07111dcc;border:1px solid #284461;border-radius:10px;padding:8px;font-size:11px;max-width:310px}
.badge{display:inline-block;padding:3px 7px;border-radius:9px;background:#233f62;margin:2px;font-size:11px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<div id="help">👆 Tippe auf einen Ort, um automatisch dorthin zu laufen. PC/Kamera = Video aufnehmen. Haus = Räume. Doppeltippen auf einen Ort funktioniert ebenfalls.</div>
<div id="record">🔴 AUFNAHME LÄUFT</div>
<div id="menu">
<button onclick="openPanel('life')">👤 Leben</button>
<button onclick="openPanel('social')">📱 Social</button>
<button onclick="openPanel('shop')">🛒 Shop</button>
<button onclick="openPanel('fans')">❤️ Fans</button>
<button onclick="openPanel('home')">🏠 Häuser</button>
<button onclick="openPanel('jobs')">💼 Jobs</button>
<button onclick="openPanel('company')">🏢 Firmen</button>
<button onclick="openPanel('guards')">🛡️ Schutz</button>
<button onclick="openPanel('owner')">👑 Owner</button>
<button onclick="toggleCamera()">🎥 Sicht</button>
<button onclick="saveGame()">💾 Speichern</button>
<button onclick="loadGame()">↩ Laden</button>
</div>
<div id="panel"></div>
<div id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const money=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const fmt=n=>new Intl.NumberFormat("de-DE",{notation:"compact",maximumFractionDigits:1}).format(n);

const state={
 name:"Johovanni", age:0, money:2500, followers:0, likes:0, views:0,
 energy:100, health:100, popularity:0, education:0, skill:10,
 career:"Noch kein Beruf", channelCount:1, currentChannel:0,
 channels:[{name:"Mein Kanal",subs:0,likes:0,views:0,income:0}],
 social:{youtube:0,tiktok:0,instagram:0,twitch:0,x:0},
 inventory:[], homes:[], currentHome:0, companies:[], employees:[],
 fans:[], sponsors:[], guards:[],
 skin:"#8b5a3c",hair:"#21150f",height:1,head:1,face:50,hairStyle:"Kurz",
 outfit:"Alltag",cameraMode:"third", recording:false, schoolFriends:[],
 unlocked:true, generation:1, alive:true, room:"Studio"
};

const defaultState=structuredClone(state);
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",2200)}
function saveGame(){localStorage.setItem("ytLifeMega",JSON.stringify(state));toast("💾 Spiel gespeichert!")}
function loadGame(){
 const x=localStorage.getItem("ytLifeMega"); if(!x){toast("Kein Spielstand gefunden.");return}
 Object.assign(state,JSON.parse(x)); refreshCharacter(); updateHUD(); toast("↩ Spielstand geladen!");
}
window.saveGame=saveGame;window.loadGame=loadGame;

function updateHUD(){
 $("hud").innerHTML=`
 <div class="stat">👤 ${state.name}</div><div class="stat">🎂 ${state.age} Jahre</div>
 <div class="stat">💶 ${money(state.money)}</div><div class="stat">👥 ${fmt(state.followers)} Follower</div>
 <div class="stat">❤️ ${fmt(state.likes)} Likes</div><div class="stat">👁️ ${fmt(state.views)} Views</div>
 <div class="stat">💼 ${state.career}</div><div class="stat">🏠 ${state.homes.length} Häuser</div>
 <div class="stat">🏢 ${state.companies.length} Firmen</div>`;
}
function openPanel(type){
 const p=$("panel");p.classList.add("show");
 const close=`<button class="close" onclick="$('panel').classList.remove('show')">✖</button>`;
 if(type==="life")p.innerHTML=close+lifeHTML();
 if(type==="social")p.innerHTML=close+socialHTML();
 if(type==="shop")p.innerHTML=close+shopHTML();
 if(type==="fans")p.innerHTML=close+fansHTML();
 if(type==="home")p.innerHTML=close+homeHTML();
 if(type==="jobs")p.innerHTML=close+jobsHTML();
 if(type==="company")p.innerHTML=close+companyHTML();
 if(type==="guards")p.innerHTML=close+guardsHTML();
 if(type==="owner")p.innerHTML=close+ownerHTML();
}
window.openPanel=openPanel;

function lifeHTML(){return `<h2>👤 Mein Leben</h2>
<div class="card"><b>Lebensphase:</b> ${phase()}<br><span class="small">Baby → Kind → Teenager → Erwachsener → Senior</span></div>
<div class="row"><input id="pname" value="${state.name}" placeholder="Name"><button onclick="setName()">Name ändern</button></div>
<div class="row"><button class="good" onclick="ageUp()">🎂 1 Jahr älter</button><button onclick="walk()">🚶 Spaziergang</button></div>
<div class="card"><b>Ausbildung:</b> ${state.education}%<br><b>Skill:</b> ${state.skill}/100<br><b>Gesundheit:</b> ${state.health}/100<br><b>Energie:</b> ${state.energy}/100</div>
<h3>🎨 Charakter</h3>
<div class="row"><label>Haut <input type="color" id="skin" value="${state.skin}"></label><label>Haare <input type="color" id="hair" value="${state.hair}"></label></div>
<div class="row"><select id="hairStyle"><option>Kurz</option><option>Lang</option><option>Lockig</option><option>Mohawk</option><option>Afro</option></select><select id="outfit"><option>Alltag</option><option>Sport</option><option>Business</option><option>Schule</option><option>Creator</option></select></div>
<button onclick="applyCharacter()">Charakter anwenden</button>
<div class="card"><b>Persönlichkeit:</b> ${personality()}</div>`}
function phase(){if(state.age<3)return"👶 Baby";if(state.age<6)return"🧒 Kleinkind";if(state.age<12)return"🎒 Kind";if(state.age<18)return"🧑 Teenager";if(state.age<65)return"🧑 Erwachsener";return"👴 Senior"}
function personality(){return ["ruhig","freundlich","ehrgeizig","kreativ","sportlich","neugierig"][state.generation%6]}
function setName(){state.name=$("pname").value||"Johovanni";refreshCharacter();updateHUD();toast("Name geändert!")}
function applyCharacter(){state.skin=$("skin").value;state.hair=$("hair").value;state.hairStyle=$("hairStyle").value;state.outfit=$("outfit").value;refreshCharacter();toast("🎨 Charakter aktualisiert!")}
function ageUp(){
 if(state.age>=100){toast("Das maximale Alter ist erreicht.");return}
 state.age++;
 if(state.age===6){state.education+=5;state.schoolFriends.push("Noah","Lina");toast("🎒 Schule beginnt!")}
 if(state.age===12){state.social.youtube+=1;toast("📱 Social Media wird freigeschaltet!")}
 if(state.age===18)toast("🎓 Du bist erwachsen! Viele Berufe sind jetzt möglich.");
 if(state.age===65)toast("👴 Seniorenphase erreicht.");
 if(Math.random()<.12)lifeEvent();
 refreshCharacter();updateHUD();
}
window.ageUp=ageUp;window.setName=setName;window.applyCharacter=applyCharacter;
function lifeEvent(){
 const events=["Ein neuer Schulfreund möchte mit dir lernen.","Ein Nachbar ist neidisch auf deinen Erfolg.","Du bekommst eine kleine Belohnung für gute Arbeit.","Ein Fan schreibt dir eine nette Nachricht.","Du findest ein interessantes Hobby."];
 const e=events[Math.floor(Math.random()*events.length)];toast("🎲 "+e);
 if(e.includes("Belohnung"))state.money+=250;
}
function walk(){state.energy=clamp(state.energy-4,0,100);toast("🚶 Du gehst spazieren.");moveTo(new THREE.Vector3((Math.random()*20)-10,.5,(Math.random()*20)-10))}

function socialHTML(){return `<h2>📱 Social Media</h2>
${Object.entries(state.social).map(([k,v])=>`<div class="card"><b>${k.toUpperCase()}</b>: ${fmt(v)} Follower</div>`).join("")}
<div class="row"><button class="good" onclick="postSocial()">📣 Post veröffentlichen</button><button onclick="stream()">🔴 Stream</button></div>
<h3>🎬 YouTube</h3><div class="card">Kanal: ${state.channels[state.currentChannel].name}<br>Abos: ${fmt(state.channels[state.currentChannel].subs)} · Likes: ${fmt(state.channels[state.currentChannel].likes)} · Views: ${fmt(state.channels[state.currentChannel].views)}</div>
<button class="good" onclick="recordVideo()">🎥 Video aufnehmen</button>
<button onclick="newChannel()">➕ Neuer Kanal (20.000 Subs + 300.000 Likes)</button>`}
function postSocial(){if(state.age<12){toast("📱 Social Media ist erst ab 12 freigeschaltet.");return}let v=500+Math.floor(Math.random()*50000);for(const k of Object.keys(state.social))state.social[k]+=Math.floor(v*(.2+Math.random()));state.likes+=Math.floor(v/2);state.money+=Math.floor(v/30);updateHUD();toast("📣 Dein Post geht ab!")}
function stream(){if(state.age<12){toast("Noch nicht freigeschaltet.");return}let v=100+Math.floor(Math.random()*100000);state.views+=v;state.followers+=Math.floor(v/20);state.money+=Math.floor(v/80);updateHUD();toast("🔴 Stream beendet: "+fmt(v)+" Views")}
function recordVideo(){
 if(state.age<12){toast("🎥 Du bist noch zu jung für den Creator-Modus.");return}
 state.recording=true;$("record").style.display="block";toast("🎥 Aufnahme läuft...");
 setTimeout(()=>{
  state.recording=false;$("record").style.display="none";
  const views=Math.max(20,Math.floor(Math.random()*5000000));
  const likes=Math.floor(views*(.02+Math.random()*.10));
  const subs=Math.floor(views*(.001+Math.random()*.012));
  const income=Math.max(1,Math.floor(views*(.002+Math.random()*.004)));
  state.views+=views;state.likes+=likes;state.followers+=subs;state.money+=income;
  let ch=state.channels[state.currentChannel];ch.views+=views;ch.likes+=likes;ch.subs+=subs;ch.income+=income;
  toast(`🎬 Video fertig: ${fmt(views)} Views · ${fmt(likes)} Likes · +${fmt(subs)} Abos · +${money(income)}`);updateHUD();
 },3500);
}
function newChannel(){
 let ch=state.channels[state.currentChannel];if(ch.subs<20000||ch.likes<300000){toast("❌ Voraussetzung nicht erfüllt.");return}
 state.channels.push({name:"Kanal "+(state.channels.length+1),subs:0,likes:0,views:0,income:0});state.currentChannel=state.channels.length-1;toast("📺 Neuer Kanal erstellt!");
}
window.postSocial=postSocial;window.stream=stream;window.recordVideo=recordVideo;window.newChannel=newChannel;

const shopItems=[];
const types=["Kamera","Mikrofon","PC","Monitor","Licht","Schreibtisch","Gamingstuhl","Sofa","Bett","Küche","TV","Regal","Deko","Pflanze","Studio-Set","Streaming-Deck","Laptop","Tablet","Konsole","Headset"];
const adjectives=["Basic","Pro","Ultra","Creator","Studio","Elite","Mega","Legend","Diamond","Future"];
for(let i=0;i<250;i++){let type=types[i%types.length], tier=Math.floor(i/25)+1;shopItems.push({name:`${adjectives[i%adjectives.length]} ${type} ${i+1}`,price:Math.floor(80+Math.pow(tier,2)*300+i*27),power:1+tier});}
function shopHTML(){return `<h2>🛒 Mega-Shop</h2><div class="small">250 verschiedene Ausrüstungs-/Möbelvarianten. Weitere Varianten können automatisch erzeugt werden.</div>
${shopItems.slice(0,80).map((x,i)=>`<div class="card"><b>${x.name}</b><br>${money(x.price)} · +${x.power} Creator-Power <button onclick="buyItem(${i})">Kaufen</button></div>`).join("")}`}
function buyItem(i){let x=shopItems[i];if(state.money<x.price){toast("💸 Zu wenig Geld.");return}state.money-=x.price;state.inventory.push(x);updateHUD();toast("🛒 "+x.name+" gekauft!")}
window.buyItem=buyItem;

function fansHTML(){if(!state.fans.length)for(let i=0;i<12;i++)state.fans.push({name:["Lina","Noah","Mia","Elias","Amira","Leon","Sofia","Paul","Nora","David","Emma","Ben"][i],money:100+Math.random()*900,friend:0});
return `<h2>❤️ Fans</h2>${state.fans.map((f,i)=>`<div class="card"><b>👤 ${f.name}</b><br>Freundschaft: ${f.friend}/100 · Fan-Geld: ${money(f.money)}
<div class="row"><button onclick="fanTalk(${i})">💬 Reden</button><button onclick="fanGift(${i})">🎁 Geschenk</button><button onclick="fanRequest(${i})">🎥 YouTuber Anfrage für ein Video</button></div></div>`).join("")}`}
function fanTalk(i){state.fans[i].friend=clamp(state.fans[i].friend+10,0,100);toast("💬 Du hast mit "+state.fans[i].name+" gesprochen.")}
function fanGift(i){if(state.money<50){toast("Nicht genug Geld.");return}state.money-=50;state.fans[i].friend=clamp(state.fans[i].friend+20,0,100);toast("🎁 Geschenk an "+state.fans[i].name)}
function fanRequest(i){if(Math.random()<.75){state.likes+=200;state.views+=1000;toast("🎥 Video-Anfrage von "+state.fans[i].name+" angenommen!")}else toast("❌ Anfrage abgelehnt.");updateHUD()}
window.fanTalk=fanTalk;window.fanGift=fanGift;window.fanRequest=fanRequest;

const homeNames=["Kleine Wohnung","Starter-Haus","Modernes Haus","Familienhaus","Stadtvilla","Penthouse","Designer-Villa","Seehaus","Landhaus","Luxushaus","Mega-Villa","Business-Villa","Skyline-Penthouse","Resort-Haus","Palast","Private Villa","Grand Estate","Ultra Estate","Millionärshaus","Elite Mansion","Mega Mansion","Royal Estate","Ocean Estate","Mountain Estate","City Palace","Diamond Villa","Billionaire Estate","Grand Palace","Future Mansion","Infinity Estate","Golden Mansion","Legend Estate","Super Estate","Empire House","Titan Estate","Cosmos Villa","Galaxy Mansion","Royal Palace","World Estate","Ultimate Mansion"];
const homes=homeNames.map((n,i)=>({name:n,price:i<20?400000+i*21000:20000000+(i-20)*51000000,rooms:["Schlafzimmer","Wohnzimmer","Küche","Bad","Gamingraum","Studio","Büro","Fitnessraum","Lager","Garten","Garage","Gästezimmer"]}));
function homeHTML(){return `<h2>🏠 Immobilien</h2><div class="small">Du kannst mehrere Häuser besitzen und zwischen ihnen wechseln.</div>${homes.map((h,i)=>`<div class="card"><b>${i+1}. ${h.name}</b><br>${money(h.price)}<br><span class="small">${h.rooms.join(" · ")}</span><br>${state.homes.includes(i)?`<button onclick="setHome(${i})">🏠 Als Zuhause setzen</button>`:`<button onclick="buyHome(${i})">Kaufen</button>`}</div>`).join("")}`}
function buyHome(i){let h=homes[i];if(state.money<h.price){toast("💸 Zu wenig Geld.");return}state.money-=h.price;state.homes.push(i);state.currentHome=i;toast("🏠 "+h.name+" gekauft!");updateHUD();refreshWorld()}
function setHome(i){if(!state.homes.includes(i))return;state.currentHome=i;toast("🏠 Zuhause gewechselt.");refreshWorld()}
window.buyHome=buyHome;window.setHome=setHome;

const jobs=[
["Schüler",0,0],["Feuerwehr",6,15],["Polizei",6,20],["Koch",3,15],["Elektriker",3,20],["Mechaniker",3,20],["Programmierer",5,35],["Lehrer",8,40],["Arzt",10,60],["Anwalt",8,55],["Pilot",10,60],["Wissenschaftler",10,65],["Banker",7,45],["Architekt",8,50],["Journalist",5,30],["Sportler",3,40],["YouTuber",0,10],["Streamer",0,10],["Unternehmer",0,30],["Fotograf",3,25]
];
function jobsHTML(){return `<h2>💼 Berufe</h2>${jobs.map((j,i)=>`<div class="card"><b>${j[0]}</b><br>Ausbildung: ${j[1]} · Skill: ${j[2]} <button onclick="chooseJob(${i})">Wählen</button></div>`).join("")}<div class="card">Jobs können ohne YouTube gespielt werden. Berufe mit Ausbildung benötigen die entsprechende Bildung.</div>`}
function chooseJob(i){let j=jobs[i];if(state.age<16&&j[0]!=="Schüler"){toast("Noch zu jung für diesen Beruf.");return}if(state.education<j[1]){state.education+=10;toast("📚 Du brauchst mehr Ausbildung. Lernen +10.");return}if(state.skill<j[2]){toast("💪 Mehr Skill nötig.");return}state.career=j[0];toast("💼 Neuer Beruf: "+j[0]);updateHUD()}
window.chooseJob=chooseJob;

function companyHTML(){return `<h2>🏢 Eigene Firmen</h2>
<div class="row"><input id="cname" placeholder="Firmenname"><input id="cind" placeholder="Branche"><button onclick="createCompany()">Firma gründen</button></div>
${state.companies.map((c,i)=>`<div class="card"><b>${c.name}</b> · ${c.industry}<br>Ort: ${c.location} · Mitarbeiter: ${c.employees}<br>Produkte/Service: ${c.product}<br>Umsatz: ${money(c.revenue)}<div class="row"><button onclick="growCompany(${i})">📈 Werbung/Expansion</button><button onclick="hireEmployee(${i})">👷 Mitarbeiter einstellen</button></div></div>`).join("")}`}
function createCompany(){if(state.money<1000){toast("Mindestens 1.000 € Startkapital nötig.");return}let name=$("cname").value||"Meine Firma",ind=$("cind").value||"Dienstleistung";state.money-=1000;state.companies.push({name,industry:ind,location:"Meine Stadt",employees:0,product:"Service",revenue:0});toast("🏢 Firma gegründet!");updateHUD();openPanel("company")}
function growCompany(i){let c=state.companies[i],gain=500+Math.floor(Math.random()*5000);c.revenue+=gain;state.money+=gain;toast("📈 Firma verdient "+money(gain));updateHUD()}
function hireEmployee(i){if(state.money<500){toast("Zu wenig Geld.");return}state.money-=500;state.companies[i].employees++;state.employees.push({company:i,name:"Mitarbeiter "+state.employees.length});toast("👷 Mitarbeiter eingestellt.");updateHUD()}
window.createCompany=createCompany;window.growCompany=growCompany;window.hireEmployee=hireEmployee;

function guardsHTML(){return `<h2>🛡️ Schutz-Team</h2><div class="small">Spielmechanik: Schutzwerte statt grafischer Gewalt.</div>${Array.from({length:50},(_,i)=>{let level=i+1;let power=Math.min(300,level*6);return `<div class="card"><b>Schutz-Team Stufe ${level}</b><br>Verteidigung: ${power}/300 · Angriff: ${power}/300 · ${level<20?"Teilzeit":"Vollzeit"}<button onclick="hireGuard(${level})">Anheuern</button></div>`}).join("")}`}
function hireGuard(level){let cost=level*1000;if(state.money<cost){toast("💸 Zu wenig Geld.");return}state.money-=cost;state.guards.push({level,power:Math.min(300,level*6),type:level<20?"Teilzeit":"Vollzeit"});toast("🛡️ Schutz-Team Stufe "+level+" aktiviert.");updateHUD()}
window.hireGuard=hireGuard;

function ownerHTML(){return `<h2>👑 Owner-Panel</h2><div class="small">Für deine eigene Spielversion. Hinweis: Ein Passwort in index.html ist keine echte Web-Sicherheit.</div>
<div class="row"><input id="ownerpw" type="password" placeholder="Owner-Passwort"><button onclick="ownerLogin()">Login</button></div><div id="ownerArea"></div>`}
function ownerLogin(){if($("ownerpw").value!=="YT-Owner-7X9!K4#P"){toast("❌ Falsches Passwort.");return}
$("ownerArea").innerHTML=`<div class="card"><button onclick="give(1000000)">💶 +1 Mio</button> <button onclick="give(1000000000)">💶 +1 Mrd</button> <button onclick="give(1000000000000)">💶 +1 Bio</button></div>
<div class="card"><button onclick="boost('followers',1000000)">👥 +1 Mio Follower</button><button onclick="boost('likes',10000000)">❤️ +10 Mio Likes</button><button onclick="boost('views',100000000)">👁️ +100 Mio Views</button></div>
<div class="card"><button onclick="unlockAll()">🔓 Alles freischalten</button><button onclick="maxSkills()">⭐ Max Skills</button><button onclick="setAge100()">🎂 Alter 100</button></div>
<div class="card"><button onclick="resetGame()" class="red">♻️ Spiel zurücksetzen</button></div>`}
function give(n){state.money+=n;updateHUD();toast("👑 Geld hinzugefügt.")}
function boost(k,n){state[k]+=n;state.channels[0][k==="followers"?"subs":k]+=n;updateHUD();toast("👑 Wert erhöht.")}
function unlockAll(){state.unlocked=true;state.followers=Math.max(state.followers,100000);state.likes=Math.max(state.likes,300000);for(let i=0;i<10;i++)state.channels.push({name:"Freigeschalteter Kanal "+(i+2),subs:0,likes:0,views:0,income:0});toast("🔓 Alles freigeschaltet!");updateHUD()}
function maxSkills(){state.skill=100;state.education=100;state.health=100;state.energy=100;toast("⭐ Werte maximiert.")}
function setAge100(){state.age=100;refreshCharacter();updateHUD();toast("🎂 Alter gesetzt.")}
function resetGame(){localStorage.removeItem("ytLifeMega");location.reload()}
window.give=give;window.boost=boost;window.unlockAll=unlockAll;window.maxSkills=maxSkills;window.setAge100=setAge100;window.resetGame=resetGame;window.ownerLogin=ownerLogin;

let scene,camera,renderer,player,playerGroup,target=null,thirdPerson=true,playerSpeed=.055;
const clickable=[];
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.8})}
function box(name,x,y,z,sx,sy,sz,color,clickFn){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));o.position.set(x,y,z);o.name=name;scene.add(o);if(clickFn){o.userData.clickFn=clickFn;clickable.push(o)}return o}
function cyl(x,y,z,r,h,color){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat(color));o.position.set(x,y,z);scene.add(o);return o}
function textLabel(t,x,y,z){/* visual labels intentionally kept lightweight */return box(t,x,y,z,.01,.01,.01,0x000000)}

function init3D(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x83b8e8);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$("game").appendChild(renderer.domElement);
 const hemi=new THREE.HemisphereLight(0xffffff,0x557788,2);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,35,10);sun.castShadow=true;scene.add(sun);
 box("ground",0,-.15,0,100,.3,100,0x4c7d48);
 buildWorld();buildPlayer();window.addEventListener("resize",resize);renderer.domElement.addEventListener("pointerdown",onPointer);
 animate();
}
function buildWorld(){
 box("house",-10,2,-8,12,4,9,0xe0d4c3,()=>goRoom("Wohnzimmer"));
 box("roof",-10,4.5,-8,13,1,10,0x5b3940);
 box("door",-10,1,-3.45,2,2.3,.2,0x5b3a2d,()=>goRoom("Eingang"));
 box("studio",10,2,-7,9,4,8,0x8c9db0,()=>goRoom("Studio"));
 box("studioDesk",8,.9,-4,4,.4,1.5,0x432f22,()=>recordVideo());
 box("pc",8,1.6,-4,.8,.9,.2,0x182a3b,()=>recordVideo());
 box("camera",10,1.5,-4,.5,.5,.8,0x111111,()=>recordVideo());
 box("sofa",-12,1,-10,5,1.3,1.5,0x3e5b70);
 box("court",15,.02,10,12,.1,7,0xb37a45,()=>toast("🏀 Du bist auf dem Basketballplatz."));
 box("field",-15,.02,10,14,.1,9,0x3e8140,()=>toast("⚽ Du bist auf dem Fußballplatz."));
 for(let i=0;i<20;i++){let x=-35+Math.random()*70,z=-30+Math.random()*60;if(Math.abs(x)<8&&Math.abs(z)<8)continue;cyl(x,1.3,z,.45,2.6,0x68482d);cyl(x,3,z,.0+1.7,3.4,0x2f6e3b)}
 const spots=[
  [-22,-18,"🏪 Shop"],[22,-18,"🏫 Schule"],[25,0,"🏙️ Stadt"],[-25,0,"🏢 Arbeit"],[0,22,"🌳 Park"]
 ];
 spots.forEach(([x,z,n])=>box(n,x,.5,z,5,1,5,0x244c6a,()=>toast(n)));
}
function buildPlayer(){
 playerGroup=new THREE.Group();scene.add(playerGroup);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.9,6,12),mat(state.outfit==="Sport"?0x2872d6:0x26384d));body.position.y=1.1;body.name="body";playerGroup.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,16),mat(state.skin));head.position.y=2.05;head.name="head";playerGroup.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.36,16,16,0,Math.PI*2,0,Math.PI*.55),mat(state.hair));hair.position.y=2.17;hair.name="hair";playerGroup.add(hair);
 const leg1=box3(.13,.7,0x222222);leg1.position.set(-.18,.45,0);playerGroup.add(leg1);
 const leg2=box3(.13,.7,0x222222);leg2.position.set(.18,.45,0);playerGroup.add(leg2);
 refreshCharacter();playerGroup.position.set(0,0,5);
}
function box3(w,h,c){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat(c));return o}
function refreshCharacter(){
 if(!playerGroup)return;
 const s=state.age<3?.55:state.age<6?.72:state.age<12?.9:state.age<18?.98:state.age<65?1.08:.95;
 playerGroup.scale.set(state.height*s,state.height*s,state.height*s);
 playerGroup.traverse(o=>{if(o.name==="head")o.material.color.set(state.skin);if(o.name==="hair")o.material.color.set(state.hair);});
}
function goRoom(r){state.room=r;toast("📍 Du bist jetzt im Bereich: "+r)}
function onPointer(e){
 const mouse=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
 const ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(clickable,false);
 if(hits.length&&hits[0].object.userData.clickFn){hits[0].object.userData.clickFn();return}
 const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);const pt=new THREE.Vector3();
 if(ray.ray.intersectPlane(plane,pt))moveTo(pt);
}
function moveTo(p){target=new THREE.Vector3(clamp(p.x,-45,45),0,clamp(p.z,-35,35))}
function animate(){
 requestAnimationFrame(animate);
 if(target){
  const d=target.clone().sub(playerGroup.position);d.y=0;
  if(d.length()<.18){target=null}else{d.normalize();playerGroup.position.addScaledVector(d,playerSpeed);playerGroup.rotation.y=Math.atan2(d.x,d.z)}
 }
 if(thirdPerson){
  const behind=new THREE.Vector3(0,4.3,6.8).applyAxisAngle(new THREE.Vector3(0,1,0),playerGroup.rotation.y);
  camera.position.lerp(playerGroup.position.clone().add(behind),.08);camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0,1.2,0)));
 }else{
  const eye=playerGroup.position.clone().add(new THREE.Vector3(0,1.7,0));
  camera.position.lerp(eye,.15);camera.lookAt(eye.clone().add(new THREE.Vector3(Math.sin(playerGroup.rotation.y),0,Math.cos(playerGroup.rotation.y))));
 }
 renderer.render(scene,camera);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function toggleCamera(){thirdPerson=!thirdPerson;toast(thirdPerson?"🎥 Third-Person-Sicht":"👁️ Eigene Sicht")}
window.toggleCamera=toggleCamera;

function refreshWorld(){updateHUD()}
window.walk=walk;
init3D();updateHUD();
setInterval(()=>{if(state.age>=12&&state.recording===false&&Math.random()<.03){state.views+=Math.floor(Math.random()*30);state.followers+=Math.floor(Math.random()*3);updateHUD()}},5000);
</script>
</body>
</html>

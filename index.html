<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YouTuber Life 3D – Realistic Life Simulator</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;color:#fff;
}
#game{position:fixed;inset:0}
canvas{display:block}

#hud{
 position:fixed;left:14px;right:14px;top:12px;z-index:30;
 display:flex;gap:7px;flex-wrap:wrap;pointer-events:none
}
.stat{
 background:rgba(8,13,22,.78);
 backdrop-filter:blur(12px);
 border:1px solid rgba(255,255,255,.16);
 border-radius:12px;
 padding:8px 11px;font-size:12px;
 box-shadow:0 7px 25px #0008
}

#help{
 position:fixed;left:50%;top:14px;transform:translateX(-50%);
 max-width:430px;text-align:center;z-index:25;
 background:rgba(7,12,20,.62);
 backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,.13);
 border-radius:24px;padding:7px 13px;font-size:11px
}

#menu{
 position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
 max-width:96%;z-index:40;
 display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
 background:rgba(5,10,18,.78);
 backdrop-filter:blur(13px);
 border:1px solid rgba(255,255,255,.13);
 padding:7px;border-radius:19px;
 box-shadow:0 10px 35px #0008
}

button,input,select{font:inherit}

button{
 border:0;border-radius:10px;padding:9px 11px;
 background:#203852;color:white;cursor:pointer
}
button:hover{background:#315574}
button.good{background:#176b46}
button.warn{background:#73551d}
button.red{background:#71303a}

#panel{
 position:fixed;z-index:60;top:64px;right:14px;
 width:min(450px,calc(100% - 28px));
 max-height:calc(100% - 130px);
 overflow:auto;
 background:rgba(5,10,18,.94);
 backdrop-filter:blur(18px);
 border:1px solid rgba(255,255,255,.16);
 border-radius:18px;padding:15px;display:none;
 box-shadow:0 15px 55px #000b
}
#panel.show{display:block}

.row{
 display:flex;gap:7px;flex-wrap:wrap;margin:7px 0
}
.row>*{flex:1;min-width:100px}

input,select{
 background:#0d1b2d;color:#fff;
 border:1px solid #385474;
 border-radius:8px;padding:8px
}

h2,h3{margin:5px 0 10px}

.card{
 background:rgba(13,26,42,.86);
 border:1px solid #25425f;
 border-radius:12px;padding:10px;margin:8px 0
}

.small{font-size:12px;color:#b9c8d9}

.close{
 float:right!important;
 background:#202a38!important;
 border-radius:50%!important;
 width:38px;height:38px;
 padding:0!important;font-size:20px!important
}

#toast{
 position:fixed;left:50%;bottom:90px;
 transform:translateX(-50%);
 z-index:100;
 background:#101d2e;
 border:1px solid #4e78a5;
 border-radius:12px;
 padding:10px 15px;
 display:none;
 box-shadow:0 10px 35px #0009
}

#record{
 position:fixed;left:50%;top:70px;
 transform:translateX(-50%);
 z-index:80;
 background:#9c1d2c;
 border-radius:20px;
 padding:8px 15px;
 display:none;
 box-shadow:0 0 28px #e51f3b88;
 animation:pulse 1s infinite
}
@keyframes pulse{
 50%{transform:translateX(-50%) scale(1.06);opacity:.65}
}

#miniMap{
 position:fixed;right:14px;top:14px;
 width:130px;height:130px;
 border-radius:50%;overflow:hidden;
 z-index:35;
 border:3px solid rgba(255,255,255,.75);
 box-shadow:0 8px 30px #0009;
 background:
 radial-gradient(circle at 50% 50%,#456b49 0 17%,transparent 18%),
 linear-gradient(135deg,#19374b,#315f42)
}

#miniMap:before{
 content:"";
 position:absolute;
 width:18px;height:140%;
 left:45%;
 top:-20%;
 background:rgba(220,220,220,.28);
 transform:rotate(23deg)
}
#miniMap:after{
 content:"";
 position:absolute;
 height:15px;width:140%;
 left:-20%;top:47%;
 background:rgba(220,220,220,.22);
 transform:rotate(-10deg)
}

#mapDot{
 position:absolute;
 left:50%;top:50%;
 width:13px;height:13px;
 border-radius:50%;
 background:#ff354d;
 border:2px solid white;
 transform:translate(-50%,-50%);
 z-index:4
}

#quick{
 position:fixed;right:14px;top:158px;
 z-index:35;
 display:flex;flex-direction:column;gap:8px
}

.quickBtn{
 width:48px;height:48px;
 border-radius:50%;
 background:rgba(9,16,25,.82);
 border:1px solid rgba(255,255,255,.2);
 color:white;font-size:20px;
 box-shadow:0 8px 22px #0007
}

#joystick{
 position:fixed;
 left:22px;bottom:82px;
 width:132px;height:132px;
 border-radius:50%;
 z-index:70;
 background:rgba(5,10,17,.43);
 border:2px solid rgba(255,255,255,.2);
 box-shadow:inset 0 0 30px #0008,0 8px 30px #0008;
 touch-action:none
}

#joyKnob{
 position:absolute;
 left:50%;top:50%;
 width:58px;height:58px;
 border-radius:50%;
 transform:translate(-50%,-50%);
 background:rgba(220,225,230,.65);
 border:2px solid rgba(255,255,255,.8);
 box-shadow:0 5px 16px #0009
}

#bottomCards{
 position:fixed;
 left:50%;bottom:76px;
 transform:translateX(-50%);
 z-index:25;
 display:flex;gap:8px;
 max-width:72%;
 overflow:hidden
}

.lifeCard{
 min-width:150px;
 background:rgba(7,13,22,.78);
 backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,.13);
 border-radius:12px;
 padding:9px;font-size:11px
}
.lifeCard b{font-size:13px}

@media(max-width:700px){
 #miniMap{width:92px;height:92px;right:9px;top:8px}
 .stat{font-size:10px;padding:6px 8px}
 .stat:nth-child(n+5){display:none}
 #help{top:105px;max-width:280px}
 .lifeCard{min-width:125px}
 .lifeCard:nth-child(n+3){display:none}
 #joystick{
   width:118px;height:118px;
   left:14px;bottom:82px
 }
 #quick{right:9px;top:110px}
 .quickBtn{width:43px;height:43px}
}
</style>
</head>

<body>

<div id="game"></div>
<div id="hud"></div>

<div id="help">
🎮 Bewege dich mit dem Steuerkreis · 🎥 PC/Kamera = Video · 🏠 Häuser = Räume
</div>

<div id="record">🔴 AUFNAHME LÄUFT</div>

<div id="miniMap">
 <div id="mapDot"></div>
</div>

<div id="quick">
 <button class="quickBtn" onclick="recordVideo()">🎥</button>
 <button class="quickBtn" onclick="openPanel('social')">📱</button>
 <button class="quickBtn" onclick="openPanel('company')">🏢</button>
 <button class="quickBtn" onclick="openPanel('home')">🏠</button>
</div>

<div id="joystick">
 <div id="joyKnob"></div>
</div>

<div id="bottomCards">
 <div class="lifeCard">
  <b>🎬 Creator</b><br>
  Videos · Social Media · Fans
 </div>
 <div class="lifeCard">
  <b>🏢 Unternehmen</b><br>
  Firmen · Mitarbeiter · Expansion
 </div>
 <div class="lifeCard">
  <b>🌍 Leben</b><br>
  Häuser · Jobs · Familie
 </div>
</div>

<div id="menu">
 <button onclick="openPanel('life')">👤 Leben</button>
 <button onclick="openPanel('social')">📱 Social</button>
 <button onclick="openPanel('shop')">🛒 Shop</button>
 <button onclick="openPanel('fans')">❤️ Fans</button>
 <button onclick="openPanel('home')">🏠 Häuser</button>
 <button onclick="openPanel('jobs')">💼 Jobs</button>
 <button onclick="openPanel('company')">🏢 Firmen</button>
 <button onclick="openPanel('guards')">🛡️ Schutz</button>
 <button onclick="openPanel('owner')">👑 Owner</button>
 <button onclick="toggleCamera()">🎥 Sicht</button>
 <button onclick="saveGame()">💾 Speichern</button>
 <button onclick="loadGame()">↩ Laden</button>
</div>

<div id="panel"></div>
<div id="toast"></div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const $=id=>document.getElementById(id);

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const money=n=>new Intl.NumberFormat("de-DE",{
 style:"currency",
 currency:"EUR",
 maximumFractionDigits:0
}).format(n);

const fmt=n=>new Intl.NumberFormat("de-DE",{
 notation:"compact",
 maximumFractionDigits:1
}).format(n);


/* =========================
   SPIELDATEN
========================= */

const state={
 name:"Johovanni",
 age:0,
 money:2500,
 followers:0,
 likes:0,
 views:0,

 energy:100,
 health:100,
 popularity:0,
 education:0,
 skill:10,

 career:"Noch kein Beruf",

 channelCount:1,
 currentChannel:0,

 channels:[
  {
   name:"Mein Kanal",
   subs:0,
   likes:0,
   views:0,
   income:0
  }
 ],

 social:{
  youtube:0,
  tiktok:0,
  instagram:0,
  twitch:0,
  x:0
 },

 inventory:[],
 homes:[],
 currentHome:0,
 companies:[],
 employees:[],

 fans:[],
 sponsors:[],
 guards:[],

 skin:"#8b5a3c",
 hair:"#21150f",
 height:1,
 head:1,
 face:50,
 hairStyle:"Kurz",
 outfit:"Alltag",

 cameraMode:"third",
 recording:false,

 schoolFriends:[],

 unlocked:true,
 generation:1,
 alive:true,
 room:"Studio"
};


/* =========================
   SAVE / LOAD
========================= */

function toast(t){
 $("toast").textContent=t;
 $("toast").style.display="block";

 clearTimeout(window.tt);

 window.tt=setTimeout(()=>{
  $("toast").style.display="none";
 },2200);
}

function saveGame(){
 localStorage.setItem(
  "ytLifeMega",
  JSON.stringify(state)
 );

 toast("💾 Spiel gespeichert!");
}

function loadGame(){

 const x=localStorage.getItem("ytLifeMega");

 if(!x){
  toast("Kein Spielstand gefunden.");
  return;
 }

 Object.assign(state,JSON.parse(x));

 refreshCharacter();
 updateHUD();

 toast("↩ Spielstand geladen!");
}

window.saveGame=saveGame;
window.loadGame=loadGame;


/* =========================
   HUD
========================= */

function updateHUD(){

 $("hud").innerHTML=`

 <div class="stat">👤 ${state.name}</div>

 <div class="stat">
 🎂 ${state.age} Jahre
 </div>

 <div class="stat">
 💶 ${money(state.money)}
 </div>

 <div class="stat">
 👥 ${fmt(state.followers)} Follower
 </div>

 <div class="stat">
 ❤️ ${fmt(state.likes)} Likes
 </div>

 <div class="stat">
 👁️ ${fmt(state.views)} Views
 </div>

 <div class="stat">
 💼 ${state.career}
 </div>

 <div class="stat">
 🏠 ${state.homes.length} Häuser
 </div>

 <div class="stat">
 🏢 ${state.companies.length} Firmen
 </div>

 `;
}


/* =========================
   PANELS
========================= */

function openPanel(type){

 const p=$("panel");

 p.classList.add("show");

 const close=
 `<button class="close"
 onclick="$('panel').classList.remove('show')">✖</button>`;

 if(type==="life")p.innerHTML=close+lifeHTML();
 if(type==="social")p.innerHTML=close+socialHTML();
 if(type==="shop")p.innerHTML=close+shopHTML();
 if(type==="fans")p.innerHTML=close+fansHTML();
 if(type==="home")p.innerHTML=close+homeHTML();
 if(type==="jobs")p.innerHTML=close+jobsHTML();
 if(type==="company")p.innerHTML=close+companyHTML();
 if(type==="guards")p.innerHTML=close+guardsHTML();
 if(type==="owner")p.innerHTML=close+ownerHTML();
}

window.openPanel=openPanel;


/* =========================
   LEBEN
========================= */

function phase(){

 if(state.age<3)return"👶 Baby";
 if(state.age<6)return"🧒 Kleinkind";
 if(state.age<12)return"🎒 Kind";
 if(state.age<18)return"🧑 Teenager";
 if(state.age<65)return"🧑 Erwachsener";

 return"👴 Senior";
}

function personality(){

 return[
  "ruhig",
  "freundlich",
  "ehrgeizig",
  "kreativ",
  "sportlich",
  "neugierig"
 ][state.generation%6];
}

function lifeHTML(){

 return`

 <h2>👤 Mein Leben</h2>

 <div class="card">
  <b>Lebensphase:</b> ${phase()}<br>
  <span class="small">
   Baby → Kind → Teenager → Erwachsener → Senior
  </span>
 </div>

 <div class="row">
  <input id="pname"
   value="${state.name}"
   placeholder="Name">

  <button onclick="setName()">
   Name ändern
  </button>
 </div>

 <div class="row">
  <button class="good"
   onclick="ageUp()">
   🎂 1 Jahr älter
  </button>

  <button onclick="walk()">
   🚶 Spaziergang
  </button>
 </div>

 <div class="card">

  <b>Ausbildung:</b> ${state.education}%<br>

  <b>Skill:</b> ${state.skill}/100<br>

  <b>Gesundheit:</b> ${state.health}/100<br>

  <b>Energie:</b> ${state.energy}/100

 </div>

 <h3>🎨 Realistische Charakter-Anpassung</h3>

 <div class="row">

  <label>
   Haut
   <input type="color"
    id="skin"
    value="${state.skin}">
  </label>

  <label>
   Haare
   <input type="color"
    id="hair"
    value="${state.hair}">
  </label>

 </div>

 <div class="row">

  <select id="hairStyle">

   <option>Kurz</option>
   <option>Lang</option>
   <option>Lockig</option>
   <option>Mohawk</option>
   <option>Afro</option>
   <option>Wellen</option>

  </select>

  <select id="outfit">

   <option>Alltag</option>
   <option>Sport</option>
   <option>Business</option>
   <option>Schule</option>
   <option>Creator</option>

  </select>

 </div>

 <button onclick="applyCharacter()">
  🎨 Charakter anwenden
 </button>

 <div class="card">
  <b>Persönlichkeit:</b>
  ${personality()}
 </div>

 <div class="card">
  <b>👤 Gesichtssystem</b><br>
  Augen · Nase · Mund · Ohren · Augenbrauen · Haare · Hals · Schultern
 </div>

 `;
}

function setName(){

 state.name=$("pname").value||"Johovanni";

 refreshCharacter();
 updateHUD();

 toast("Name geändert!");
}

function applyCharacter(){

 state.skin=$("skin").value;
 state.hair=$("hair").value;
 state.hairStyle=$("hairStyle").value;
 state.outfit=$("outfit").value;

 refreshCharacter();

 toast("🎨 Realistischer Charakter aktualisiert!");
}

function ageUp(){

 if(state.age>=100){
  toast("Maximales Alter erreicht.");
  return;
 }

 state.age++;

 if(state.age===6){
  state.education+=5;
  state.schoolFriends.push("Noah","Lina");
  toast("🎒 Schule beginnt!");
 }

 if(state.age===12){
  state.social.youtube+=1;
  toast("📱 Social Media freigeschaltet!");
 }

 if(state.age===18){
  toast("🎓 Erwachsenenleben freigeschaltet!");
 }

 if(state.age===65){
  toast("👴 Seniorenphase erreicht.");
 }

 if(Math.random()<.12){
  lifeEvent();
 }

 refreshCharacter();
 updateHUD();
}

window.ageUp=ageUp;
window.setName=setName;
window.applyCharacter=applyCharacter;

function lifeEvent(){

 const events=[
  "Ein neuer Schulfreund möchte mit dir lernen.",
  "Ein Nachbar ist neidisch auf deinen Erfolg.",
  "Du bekommst eine kleine Belohnung.",
  "Ein Fan schreibt dir eine nette Nachricht.",
  "Du findest ein interessantes Hobby.",
  "Du lernst eine neue Person kennen."
 ];

 const e=events[Math.floor(Math.random()*events.length)];

 toast("🎲 "+e);

 if(e.includes("Belohnung")){
  state.money+=250;
 }
}

function walk(){

 state.energy=clamp(
  state.energy-4,
  0,
  100
 );

 toast("🚶 Du gehst spazieren.");

 moveTo(
  new THREE.Vector3(
   Math.random()*50-25,
   0,
   Math.random()*50-25
  )
 );
}

window.walk=walk;


/* =========================
   SOCIAL
========================= */

function socialHTML(){

 return`

 <h2>📱 Social Media</h2>

 ${Object.entries(state.social)
  .map(([k,v])=>`

   <div class="card">
    <b>${k.toUpperCase()}</b>:
    ${fmt(v)} Follower
   </div>

  `).join("")}

 <div class="row">

  <button class="good"
   onclick="postSocial()">
   📣 Post
  </button>

  <button onclick="stream()">
   🔴 Stream
  </button>

 </div>

 <h3>🎬 YouTube</h3>

 <div class="card">

  Kanal:
  ${state.channels[state.currentChannel].name}

  <br>

  Abos:
  ${fmt(state.channels[state.currentChannel].subs)}

  · Likes:
  ${fmt(state.channels[state.currentChannel].likes)}

  · Views:
  ${fmt(state.channels[state.currentChannel].views)}

 </div>

 <button class="good"
 onclick="recordVideo()">
 🎥 Video aufnehmen
 </button>

 <button onclick="newChannel()">
 ➕ Neuer Kanal
 </button>

 <div class="small">
 Neuer Kanal:
 20.000 Abos + 300.000 Likes
 </div>

 `;
}

function postSocial(){

 if(state.age<12){
  toast("📱 Social Media ist erst ab 12 freigeschaltet.");
  return;
 }

 let v=
 500+
 Math.floor(Math.random()*50000);

 for(const k of Object.keys(state.social)){
  state.social[k]+=
   Math.floor(v*(.2+Math.random()));
 }

 state.likes+=Math.floor(v/2);
 state.money+=Math.floor(v/30);

 updateHUD();

 toast("📣 Dein Post geht ab!");
}

function stream(){

 if(state.age<12){
  toast("Noch nicht freigeschaltet.");
  return;
 }

 let v=
 100+
 Math.floor(Math.random()*100000);

 state.views+=v;
 state.followers+=Math.floor(v/20);
 state.money+=Math.floor(v/80);

 updateHUD();

 toast(
  "🔴 Stream beendet: "+
  fmt(v)+" Views"
 );
}

function recordVideo(){

 if(state.age<12){
  toast("🎥 Creator-Modus ist noch nicht freigeschaltet.");
  return;
 }

 if(state.recording){
  toast("🎥 Du nimmst bereits auf.");
  return;
 }

 state.recording=true;

 $("record").style.display="block";

 toast("🎥 Kamera läuft...");

 setTimeout(()=>{

  state.recording=false;

  $("record").style.display="none";

  const views=
   Math.max(
    20,
    Math.floor(Math.random()*5000000)
   );

  const likes=
   Math.floor(
    views*(.02+Math.random()*.10)
   );

  const subs=
   Math.floor(
    views*(.001+Math.random()*.012)
   );

  const income=
   Math.max(
    1,
    Math.floor(
     views*(.002+Math.random()*.004)
    )
   );

  state.views+=views;
  state.likes+=likes;
  state.followers+=subs;
  state.money+=income;

  let ch=
   state.channels[state.currentChannel];

  ch.views+=views;
  ch.likes+=likes;
  ch.subs+=subs;
  ch.income+=income;

  toast(
   `🎬 Video fertig:
   ${fmt(views)} Views ·
   ${fmt(likes)} Likes ·
   +${fmt(subs)} Abos ·
   +${money(income)}`
  );

  updateHUD();

 },3500);
}

function newChannel(){

 let ch=
  state.channels[state.currentChannel];

 if(
  ch.subs<20000 ||
  ch.likes<300000
 ){
  toast("❌ Voraussetzungen nicht erfüllt.");
  return;
 }

 state.channels.push({
  name:"Kanal "+(state.channels.length+1),
  subs:0,
  likes:0,
  views:0,
  income:0
 });

 state.currentChannel=
  state.channels.length-1;

 toast("📺 Neuer Kanal erstellt!");
}

window.postSocial=postSocial;
window.stream=stream;
window.recordVideo=recordVideo;
window.newChannel=newChannel;


/* =========================
   SHOP
========================= */

const shopItems=[];

const types=[
 "Kamera","Mikrofon","PC","Monitor",
 "Licht","Schreibtisch","Gamingstuhl",
 "Sofa","Bett","Küche","TV","Regal",
 "Deko","Pflanze","Studio-Set",
 "Streaming-Deck","Laptop","Tablet",
 "Konsole","Headset"
];

const adjectives=[
 "Basic","Pro","Ultra","Creator",
 "Studio","Elite","Mega",
 "Legend","Diamond","Future"
];

for(let i=0;i<250;i++){

 let type=types[i%types.length];

 let tier=Math.floor(i/25)+1;

 shopItems.push({
  name:
   `${adjectives[i%adjectives.length]} ${type} ${i+1}`,

  price:
   Math.floor(
    80+
    Math.pow(tier,2)*300+
    i*27
   ),

  power:1+tier
 });
}

function shopHTML(){

 return`

 <h2>🛒 Mega-Shop</h2>

 <div class="small">
  250 Ausrüstungs- und Möbelvarianten.
 </div>

 ${shopItems.slice(0,80).map((x,i)=>`

 <div class="card">

  <b>${x.name}</b><br>

  ${money(x.price)}
  · +${x.power} Creator-Power

  <button onclick="buyItem(${i})">
   Kaufen
  </button>

 </div>

 `).join("")}

 `;
}

function buyItem(i){

 let x=shopItems[i];

 if(state.money<x.price){
  toast("💸 Zu wenig Geld.");
  return;
 }

 state.money-=x.price;

 state.inventory.push(x);

 updateHUD();

 toast("🛒 "+x.name+" gekauft!");
}

window.buyItem=buyItem;


/* =========================
   FANS
========================= */

function fansHTML(){

 if(!state.fans.length){

  for(let i=0;i<12;i++){

   state.fans.push({
    name:[
     "Lina","Noah","Mia","Elias",
     "Amira","Leon","Sofia","Paul",
     "Nora","David","Emma","Ben"
    ][i],

    money:100+Math.random()*900,
    friend:0
   });

  }
 }

 return`

 clickFn

  o.userData.clickFn=clickFn;

  clickable.push(o);

 );

 o.receiveShadow=true;

 return o;
}

){

========================================================== */

/*
 Wenn du später einen eigenen legalen GLB-Spieler
 in deinen GitHub-Ordner legst:

 assets/player.glb

 kann dieser geladen werden.

 Wenn die Datei fehlt, bleibt automatisch
 der realistische prozedurale Charakter.
*/

async function tryLoadRealGLB(){

 try{

  const loader=new GLTFLoader();

  const gltf=
   await loader.loadAsync(
    "assets/player.glb"
   );

  if(!gltf || !gltf.scene)return;

  const model=gltf.scene;

  model.traverse(o=>{

   if(o.isMesh){

    o.castShadow=true;
    o.receiveShadow=true;

    if(o.material){

     if(o.material.map){
      o.material.map.colorSpace=
       THREE.SRGBColorSpace;
     }

    }
   }

  });

  model.scale.setScalar(1);

  model.position.set(
   0,0,5
  );

  scene.add(model);

  toast(
   "✨ Realistisches 3D-Modell geladen!"
  );

 }catch(e){

  console.log(
   "Kein player.glb gefunden – "
   +"prozeduraler realistischer Charakter bleibt aktiv."
  );

 }
}

function refreshCharacter(){

 const s=
  state.age<3?.55:
  state.age<6?.72:
  state.age<12?.9:
  state.age<18?.98:
  state.age<65?1.08:.95;

 playerGroup.scale.set(
  state.height*s,
  state.height*s,
  state.height*s
 );


 /* Haut */

 playerGroup.traverse(o=>{

  if(
   o.isMesh &&
   o.material &&
   o!==playerParts.hair
  ){

   if(
    o.name==="head" ||
    o===playerParts.head
   ){

    o.material.color.set(
     state.skin
    );
   }

  }

 });


 /* Haare */

 if(playerParts.hair){

  playerParts.hair.material.color.set(
   state.hair
  );

 }

 /* Kleidung */

 if(playerParts.torso){

  playerParts.torso.material.color.set(
   state.outfit==="Sport"
   ?0x2872d6
   :
   state.outfit==="Business"
   ?0x171d29

 }

}

/* ==========================================================
   JOYSTICK
========================================================== */

let joyX=0;
let joyY=0;
let joyActive=false;

const joy=$("joystick");
const knob=$("joyKnob");

function setJoy(e){

 const r=
  joy.getBoundingClientRect();

 const cx=
  r.left+r.width/2;

 const cy=
  r.top+r.height/2;

 let x=
  e.clientX-cx;

 let y=
  e.clientY-cy;

 const max=
  r.width*.32;

 const len=
  Math.hypot(x,y);

 if(len>max){

  x=x/len*max;
  y=y/len*max;

 }

 knob.style.left=
  (50+x/r.width*100)+"%";

 knob.style.top=
  (50+y/r.height*100)+"%";

 joyX=x/max;
 joyY=y/max;
}

function stopJoy(){

 joyActive=false;

 joyX=0;
 joyY=0;

 knob.style.left="50%";
 knob.style.top="50%";
}

joy.addEventListener(
 "pointerdown",
 e=>{
  joyActive=true;
  joy.setPointerCapture(e.pointerId);
  setJoy(e);
 }
);

joy.addEventListener(
 "pointermove",
 e=>{
  if(joyActive)setJoy(e);
 }
);

joy.addEventListener(
 "pointerup",
 stopJoy
);

joy.addEventListener(
 "pointercancel",
 stopJoy
);


/* ==========================================================
   ANIMATION
========================================================== */

let last=performance.now();

function animate(now){

 requestAnimationFrame(animate);

 const dt=
  Math.min(
   (now-last)/1000,
   .05
  );

 last=now;


 /* Joystick */

 if(
  joyActive &&
  Math.hypot(joyX,joyY)>.08
 ){

  const direction=
   new THREE.Vector3(
    joyX,
    0,
    joyY
   );

  direction.normalize();

  playerGroup.position.addScaledVector(
   direction,
   playerSpeed*
   Math.min(1.3,
    Math.hypot(joyX,joyY)+.15
   )
  );

  playerGroup.position.x=
   clamp(
    playerGroup.position.x,
    -75,75
   );

  playerGroup.position.z=
   clamp(
    playerGroup.position.z,
    -75,75
   );

  playerGroup.rotation.y=
   Math.atan2(
    direction.x,
    direction.z
   );

  target=null;

 }


 /* Automatisches Laufen */

 if(
  !joyActive &&
  target
 ){

  const d=
   target.clone()
   .sub(playerGroup.position);

  d.y=0;

  if(d.length()<.18){

   target=null;

  }else{

   d.normalize();

   playerGroup.position.addScaledVector(
    d,
    playerSpeed
   );

   playerGroup.rotation.y=
    Math.atan2(
     d.x,
     d.z
    );

  }

 }


 /* leichte Laufanimation */

 const moving=
  joyActive||
  target!==null;

 if(moving){

  const t=
   performance.now()*.012;

  playerGroup.position.y=
   Math.abs(Math.sin(t))*.025;

 }else{

  playerGroup.position.y=
   THREE.MathUtils.lerp(
    playerGroup.position.y,
    0,
    .15
   );

 }


 /* Third Person */

 if(thirdPerson){

  const behind=
   new THREE.Vector3(
    0,
    4.0,
    6.8
   ).applyAxisAngle(
    new THREE.Vector3(0,1,0),
    playerGroup.rotation.y
   );

  camera.position.lerp(
   playerGroup.position
    .clone()
    .add(behind),
   .08
  );

  camera.lookAt(
   playerGroup.position
    .clone()
    .add(
     new THREE.Vector3(
      0,1.25,0
     )
    )
  );

 }else{

  /* First Person */

  const eye=
   playerGroup.position
    .clone()
    .add(
     new THREE.Vector3(
      0,1.68,0
     )
    );

  camera.position.lerp(
   eye,
   .15
  );

  camera.lookAt(
   eye.clone().add(
    new THREE.Vector3(
     Math.sin(playerGroup.rotation.y),
     -.02,
     Math.cos(playerGroup.rotation.y)
    )
   )
  );

 }


 /* MiniMap */

 const px=
  50+
  playerGroup.position.x/150*100;

 const pz=
  50+
  playerGroup.position.z/150*100;

 $("mapDot").style.left=
  clamp(px,5,95)+"%";

 $("mapDot").style.top=
  clamp(pz,5,95)+"%";


 renderer.render(
  scene,
  camera
 );
}

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YouTuber Life – Realistic Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:white}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:10;background:rgba(10,10,15,.82);padding:12px;border-radius:14px;backdrop-filter:blur(8px);min-width:250px}
#hud b{font-size:18px}
.stat{margin:4px 0;font-size:13px}
button{border:0;border-radius:10px;padding:9px 12px;margin:3px;background:#242936;color:#fff;cursor:pointer;font-weight:bold}
button:hover{background:#394052}
#buttons{position:fixed;right:12px;top:12px;z-index:10;width:180px}
#buttons button{width:100%}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:min(94vw,650px);max-height:82vh;overflow:auto;background:rgba(15,18,25,.97);padding:20px;border-radius:18px;display:none;box-shadow:0 20px 80px #000}
#panel h2{margin-top:0}
.card{background:#202532;border-radius:12px;padding:12px;margin:8px 0}
.close{background:#b22}
#joy{position:fixed;left:25px;bottom:25px;width:125px;height:125px;border-radius:50%;background:rgba(30,35,45,.75);border:3px solid rgba(255,255,255,.2);z-index:12;touch-action:none}
#stick{position:absolute;width:55px;height:55px;border-radius:50%;background:#777;left:32px;top:32px}
#rec{position:fixed;left:50%;top:25px;transform:translateX(-50%);background:#d11;padding:8px 15px;border-radius:20px;display:none;z-index:15;font-weight:bold}
#mode{position:fixed;bottom:20px;right:20px;z-index:11}
#loading{position:fixed;inset:0;background:#090b10;z-index:99;display:flex;align-items:center;justify-content:center;font-size:22px}
</style>
</head>
<body>

<div id="loading">Welt wird geladen...</div>

<div id="hud">
<b>🎥 YouTuber Life</b>
<div class="stat">💰 Geld: €<span id="money">10000</span></div>
<div class="stat">👥 Abonnenten: <span id="subs">0</span></div>
<div class="stat">❤️ Likes: <span id="likes">0</span></div>
<div class="stat">👁️ Views: <span id="views">0</span></div>
<div class="stat">🎂 Alter: <span id="age">16</span></div>
<div class="stat">⭐ Level: <span id="level">1</span></div>
</div>

<div id="buttons">
<button onclick="openPanel('social')">📱 Social Media</button>
<button onclick="recordVideo()">🎥 Video aufnehmen</button>
<button onclick="openPanel('shop')">🛒 Shop</button>
<button onclick="openPanel('fans')">👥 Fans</button>
<button onclick="openPanel('homes')">🏠 Häuser</button>
<button onclick="openPanel('jobs')">💼 Berufe</button>
<button onclick="openPanel('company')">🏢 Unternehmen</button>
<button onclick="openPanel('guards')">🛡️ Bodyguards</button>
<button onclick="openPanel('life')">❤️ Leben</button>
<button onclick="openPanel('owner')">👑 Besitzer</button>
<button onclick="saveGame()">💾 Speichern</button>
<button onclick="loadGame()">📂 Laden</button>
</div>

<div id="mode">
<button onclick="toggleCamera()">👁️ Perspektive wechseln</button>
</div>

<div id="joy"><div id="stick"></div></div>
<div id="rec">🔴 AUFNAHME LÄUFT</div>

<div id="panel"></div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9eb7d4);
scene.fog=new THREE.Fog(0x9eb7d4,80,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x445566,2.2);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(80,120,60);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;
scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x46504a,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function box(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.7})
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

function cyl(x,y,z,r,h,color){
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,h,20),
  new THREE.MeshStandardMaterial({color,roughness:.7})
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 scene.add(m);
 return m;
}

/* STADT */
box(0,.05,0,500,.1,500,0x30332f);

for(let i=-100;i<=100;i+=25){
 box(i,.08,0,8,.12,240,0x25282b);
 box(0,.09,i,240,.12,8,0x25282b);
}

for(let x=-110;x<=110;x+=22){
 for(let z=-110;z<=110;z+=22){
  if(Math.abs(x)<35 && Math.abs(z)<35)continue;
  let h=8+Math.random()*25;
  box(x,h/2,z,13,h,13,
   new THREE.Color().setHSL(.58,.12,.18+Math.random()*.15));
 }
}

/* BÄUME */
for(let i=0;i<100;i++){
 let x=(Math.random()-.5)*230;
 let z=(Math.random()-.5)*230;
 if(Math.abs(x)<40&&Math.abs(z)<40)continue;
 cyl(x,2,z,.8,4,0x5b3a24);
 let crown=cyl(x,5,z,2.7,5,0x285c32);
}

/* HAUS */
box(0,2,-10,30,4,20,0xc8c0ad);
box(0,5,-10,31,2,21,0x403d3a);

box(-10,2,-20,8,4,.4,0x22252a);
box(0,2,-20,8,4,.4,0x22252a);
box(10,2,-20,8,4,.4,0x22252a);

const door=box(0,2,-20.25,3,4,.5,0x513b2d);

/* STUDIO */
box(0,1,-4,12,2,7,0x20252b);
box(-4,2,-6,2,2,2,0x111318);
box(-4,3,-6,2,1.5,.15,0x10151a);

const cameraObj=new THREE.Group();
const camBody=box(5,2,-6,2,1.2,1.3,0x111111);
cameraObj.add(camBody);
const lens=new THREE.Mesh(
 new THREE.CylinderGeometry(.55,.55,.8,24),
 new THREE.MeshStandardMaterial({color:0x111827,metalness:.5,roughness:.3})
);
lens.rotation.z=Math.PI/2;
lens.position.set(6,2,-6);
lens.castShadow=true;
cameraObj.add(lens);
scene.add(cameraObj);

box(5,.7,-6,2.5,.2,2.5,0x111111);
box(4.2,2.8,-6,.15,2.8,.15,0x222222);
box(5.8,2.8,-6,.15,2.8,.15,0x222222);

/* MENSCH */
const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.55,1.35,8,16),
 new THREE.MeshStandardMaterial({color:0x6b3f25,roughness:.8})
);
body.position.y=1.45;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.52,32,24),
 new THREE.MeshStandardMaterial({color:0x6b3f25,roughness:.75})
);
head.position.y=2.65;
head.castShadow=true;
player.add(head);

const hair=new THREE.Mesh(
 new THREE.SphereGeometry(.55,32,18,0,Math.PI*2,0,Math.PI*.55),
 new THREE.MeshStandardMaterial({color:0x141414,roughness:.9})
);
hair.position.y=2.78;
hair.castShadow=true;
player.add(hair);

function eye(x){
 const e=new THREE.Mesh(
  new THREE.SphereGeometry(.075,16,12),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 e.position.set(x,2.72,.47);
 player.add(e);
 const p=new THREE.Mesh(
  new THREE.SphereGeometry(.035,12,8),
  new THREE.MeshStandardMaterial({color:0x111111})
 );
 p.position.set(x,2.72,.535);
 player.add(p);
}
eye(-.18);eye(.18);

const nose=new THREE.Mesh(
 new THREE.ConeGeometry(.06,.18,12),
 new THREE.MeshStandardMaterial({color:0x59331f})
);
nose.rotation.x=Math.PI/2;
nose.position.set(0,2.57,.53);
player.add(nose);

const mouth=box(0,2.43,.52,.22,.035,.03,0x301515);
player.add(mouth);

const leg1=box(-.22,.55,0,.35,1,.35,0x171b25);
const leg2=box(.22,.55,0,.35,1,.35,0x171b25);
player.add(leg1,leg2);

player.position.set(0,0,15);
scene.add(player);

/* SPIELDATEN */
let data={
 money:10000,
 subs:0,
 likes:0,
 views:0,
 age:16,
 level:1,
 channels:1,
 followers:{
  YouTube:0,TikTok:0,Instagram:0,Twitch:0,X:0
 },
 skills:{
  intelligence:10,
  social:10,
  creativity:10,
  fitness:10
 },
 homes:[],
 inventory:[],
 companies:[],
 guards:[],
 fans:[],
 job:"Kein Beruf"
};

const names=[
 "Lukas","Mia","Noah","Emma","Jonas","Sofia","Leon","Amira",
 "David","Sarah","Paul","Lina","Elias","Nina","Ben","Lea",
 "Samuel","Marie","Daniel","Amina"
];

function updateHUD(){
 money.textContent=Math.floor(data.money).toLocaleString("de-DE");
 subs.textContent=Math.floor(data.subs).toLocaleString("de-DE");
 likes.textContent=Math.floor(data.likes).toLocaleString("de-DE");
 views.textContent=Math.floor(data.views).toLocaleString("de-DE");
 age.textContent=data.age;
 level.textContent=data.level;
}

function openPanel(type){
 const p=document.getElementById("panel");
 p.style.display="block";

 let html=`<button class="close" onclick="closePanel()">✖ Schließen</button>`;

 if(type==="social"){
  html+=`<h2>📱 Social Media</h2>`;
  for(let s of Object.keys(data.followers)){
   html+=`<div class="card"><b>${s}</b><br>
   Follower: ${data.followers[s].toLocaleString("de-DE")}
   <button onclick="socialPost('${s}')">Posten</button>
   <button onclick="socialStream('${s}')">Stream</button></div>`;
  }
 }

 if(type==="shop"){
  html+=`<h2>🛒 Mega-Shop</h2>`;
  const items=[
   ["4K Kamera",1200],["Pro Kamera",8500],["Studio Kamera",25000],
   ["Gaming-PC",1800],["High-End PC",8000],["Server-PC",30000],
   ["Mikrofon",300],["Pro Mikrofon",1500],["Studio Mikrofon",5000],
   ["Ringlicht",120],["Studio Licht",600],["Pro Lichtsystem",4000],
   ["Gamingstuhl",250],["Luxussofa",3000],["Creator-Schreibtisch",1500],
   ["Gaming Monitor",700],["4K Monitor",1800],["Studio Monitor",5000],
   ["Kühlschrank",1200],["Bett",1000],["Luxus-Bett",12000],
   ["Fitnessgerät",900],["Pro Laufband",5000],["Kamera-Drohne",2500]
  ];
  for(let i=0;i<220;i++){
   let base=items[i%items.length];
   let mult=1+Math.floor(i/items.length)*.8;
   let price=Math.floor(base[1]*mult);
   html+=`<button onclick="buyItem('${base[0]} ${i+1}',${price})">
   ${base[0]} ${i+1} – €${price.toLocaleString("de-DE")}</button>`;
  }
 }

 if(type==="fans"){
  html+=`<h2>👥 Fans</h2>`;
  if(!data.fans.length) html+=`<p>Noch keine persönlichen Fans. Erstelle Videos!</p>`;
  data.fans.slice(0,50).forEach((f,i)=>{
   html+=`<div class="card"><b>${f.name}</b><br>
   Sympathie: ${f.like}<br>
   <button onclick="fanMoney(${i})">💶 Geld geben</button>
   <button onclick="fanGift(${i})">🎁 Geschenk</button>
   <button onclick="fanVideo(${i})">🎥 YouTuber Anfrage für ein Video</button>
   </div>`;
  });
 }

 if(type==="homes"){
  html+=`<h2>🏠 Immobilien</h2>`;
  const homes=[];
  for(let i=1;i<=40;i++){
   let price=i<=20?400000+(i-1)*21000:20000000+(i-21)*50000000;
   homes.push([`Luxushaus ${i}`,price]);
  }
  homes.forEach((h,i)=>{
   html+=`<div class="card"><b>${h[0]}</b><br>€${h[1].toLocaleString("de-DE")}
   <button onclick="buyHome('${h[0]}',${h[1]})">Kaufen</button></div>`;
  });
  html+=`<p>Besitztümer: ${data.homes.join(", ")||"keine"}</p>`;
 }

 if(type==="jobs"){
  html+=`<h2>💼 Berufe</h2>`;
  const jobs=[
   ["Feuerwehrmann",20],["Polizist",20],["Arzt",25],["Lehrer",22],
   ["Anwalt",25],["Programmierer",18],["Elektriker",18],
   ["Mechaniker",18],["Koch",16],["Pilot",25],["Wissenschaftler",25],
   ["Banker",20],["Architekt",22],["Ingenieur",23],["Fotograf",16],
   ["Musiker",16],["Schauspieler",16],["Unternehmer",18],
   ["YouTuber",12],["Streamer",12]
  ];
  jobs.forEach(j=>{
   html+=`<div class="card"><b>${j[0]}</b><br>Startalter: ${j[1]}
   <button onclick="chooseJob('${j[0]}',${j[1]})">Beruf wählen</button></div>`;
  });
  html+=`<p>Aktueller Beruf: <b>${data.job}</b></p>`;
 }

 if(type==="company"){
  html+=`<h2>🏢 Unternehmen</h2>
  <button onclick="createCompany()">➕ Unternehmen gründen</button>`;
  data.companies.forEach(c=>{
   html+=`<div class="card"><b>${c.name}</b><br>
   Branche: ${c.industry}<br>
   Mitarbeiter: ${c.employees}<br>
   Umsatz: €${c.money.toLocaleString("de-DE")}
   </div>`;
  });
 }

 if(type==="guards"){
  html+=`<h2>🛡️ Bodyguards</h2>`;
  for(let i=1;i<=500;i++){
   let damage=Math.min(300,i);
   let price=500+i*5000;
   html+=`<button onclick="hireGuard(${i},${price})">
   Stufe ${i} – Schutz ${damage} – €${price.toLocaleString("de-DE")}</button>`;
  }
 }

 if(type==="life"){
  html+=`<h2>❤️ Leben</h2>
  <div class="card">Alter: ${data.age}</div>
  <button onclick="ageUp()">🎂 Ein Jahr älter werden</button>
  <button onclick="train()">🏋️ Trainieren</button>
  <button onclick="study()">📚 Lernen</button>
  <button onclick="walk()">🚶 Spaziergang</button>
  <button onclick="makeFan()">👥 Zufälligen Fan treffen</button>`;
 }

 if(type==="owner"){
  html+=`<h2>👑 Besitzer-Panel</h2>
  <input id="ownerpass" type="password" placeholder="Passwort">
  <button onclick="ownerLogin()">Einloggen</button>
  <div id="ownerarea"></div>`;
 }

 p.innerHTML=html;
}

window.openPanel=openPanel;

function closePanel(){document.getElementById("panel").style.display="none"}
window.closePanel=closePanel;

function recordVideo(){
 const rec=document.getElementById("rec");
 rec.style.display="block";
 cameraObj.position.y=.4;
 setTimeout(()=>{
  rec.style.display="none";
  cameraObj.position.y=0;
  let v=Math.floor(100+Math.random()*1000000);
  let l=Math.floor(v*(.02+Math.random()*.08));
  let s=Math.floor(v*(.005+Math.random()*.02));
  let moneyGain=Math.floor(v*.015);
  data.views+=v;
  data.likes+=l;
  data.subs+=s;
  data.money+=moneyGain;
  data.followers.YouTube+=s;
  data.level=Math.max(1,Math.floor(data.subs/20000)+1);

  let newFans=Math.min(10,Math.floor(v/100000)+1);
  for(let i=0;i<newFans;i++){
   data.fans.push({
    name:names[Math.floor(Math.random()*names.length)]+" #"+(data.fans.length+1),
    like:Math.floor(50+Math.random()*51)
   });
  }
  updateHUD();
  alert(`Video veröffentlicht!\n\n👁️ ${v.toLocaleString("de-DE")} Views\n❤️ ${l.toLocaleString("de-DE")} Likes\n👥 +${s.toLocaleString("de-DE")} Abos\n💰 +€${moneyGain.toLocaleString("de-DE")}`);
 },3000);
}
window.recordVideo=recordVideo;

function socialPost(s){
 let f=Math.floor(20+Math.random()*50000);
 let money=Math.floor(f*.02);
 data.followers[s]+=f;
 data.money+=money;
 data.likes+=Math.floor(f*.4);
 updateHUD();
 alert(`${s}-Post veröffentlicht!\n+${f.toLocaleString("de-DE")} Follower`);
}
window.socialPost=socialPost;

function socialStream(s){
 let f=Math.floor(100+Math.random()*100000);
 data.followers[s]+=f;
 data.money+=Math.floor(f*.03);
 updateHUD();
 alert(`${s}-Stream beendet!\n+${f.toLocaleString("de-DE")} Follower`);
}
window.socialStream=socialStream;

function buyItem(name,price){
 if(data.money<price)return alert("Nicht genug Geld!");
 data.money-=price;
 data.inventory.push(name);
 updateHUD();
}
window.buyItem=buyItem;

function buyHome(name,price){
 if(data.money<price)return alert("Nicht genug Geld!");
 data.money-=price;
 data.homes.push(name);
 updateHUD();
 alert(`${name} gekauft!`);
}
window.buyHome=buyHome;

function chooseJob(job,minAge){
 if(data.age<minAge)return alert(`Für diesen Beruf brauchst du mindestens ${minAge} Jahre.`);
 data.job=job;
 alert(`Du arbeitest jetzt als ${job}.`);
}
window.chooseJob=chooseJob;

function createCompany(){
 if(data.money<50000)return alert("Du brauchst mindestens €50.000 Startkapital.");
 let name=prompt("Name des Unternehmens:");
 if(!name)return;
 let industry=prompt("Branche:");
 if(!industry)return;
 data.money-=50000;
 data.companies.push({name,industry,employees:1,money:0});
 updateHUD();
 openPanel("company");
}
window.createCompany=createCompany;

function hireGuard(level,price){
 if(data.money<price)return alert("Nicht genug Geld!");
 data.money-=price;
 data.guards.push({level,damage:Math.min(300,level)});
 updateHUD();
}
window.hireGuard=hireGuard;

function fanMoney(i){
 if(data.money<100)return alert("Du hast nicht genug Geld.");
 data.money-=100;
 data.fans[i].like=Math.min(100,data.fans[i].like+5);
 updateHUD();
}
window.fanMoney=fanMoney;

function fanGift(i){
 if(data.money<500)return alert("Nicht genug Geld.");
 data.money-=500;
 data.fans[i].like=Math.min(100,data.fans[i].like+10);
 updateHUD();
}
window.fanGift=fanGift;

function fanVideo(i){
 if(Math.random()<.7){
  data.views+=Math.floor(500+Math.random()*50000);
  data.likes+=Math.floor(50+Math.random()*5000);
  data.subs+=Math.floor(20+Math.random()*2000);
  updateHUD();
  alert(`${data.fans[i].name} hat dein Video unterstützt! 🎥`);
 }else{
  alert(`${data.fans[i].name} hat die Anfrage abgelehnt.`);
 }
}
window.fanVideo=fanVideo;

function ageUp(){
 data.age++;
 if(data.age===6)alert("🏫 Du kommst in die Schule!");
 if(data.age===12)alert("📱 Du kannst jetzt Social Media nutzen!");
 if(data.age===16)alert("💼 Viele Jobs werden jetzt möglich!");
 if(data.age===18)alert("🎓 Du bist volljährig!");
 updateHUD();
 closePanel();
}
window.ageUp=ageUp;

function train(){
 data.skills.fitness++;
 data.skills.social+=Math.random()<.2?1:0;
 alert("Training abgeschlossen! 💪");
}
window.train=train;

function study(){
 data.skills.intelligence++;
 data.skills.creativity+=Math.random()<.3?1:0;
 alert("Du hast gelernt! 📚");
}
window.study=study;

function walk(){
 player.position.x+=(Math.random()-.5)*20;
 player.position.z+=(Math.random()-.5)*20;
 alert("Du gehst spazieren. 🚶");
}
window.walk=walk;

function makeFan(){
 data.fans.push({
  name:names[Math.floor(Math.random()*names.length)]+" #"+(data.fans.length+1),
  like:Math.floor(40+Math.random()*61)
 });
 alert("Du hast einen neuen Fan getroffen! 👥");
}
window.makeFan=makeFan;

function ownerLogin(){
 const pass=document.getElementById("ownerpass").value;
 const area=document.getElementById("ownerarea");
 if(pass!=="YT-Owner-7X9!K4#P"){
  area.innerHTML="<p>❌ Falsches Passwort</p>";
  return;
 }
 area.innerHTML=`
 <div class="card">
 <h3>👑 Besitzer freigeschaltet</h3>
 <button onclick="ownerMoney()">💰 +1 Milliarde €</button>
 <button onclick="ownerMax()">⭐ Alles maximieren</button>
 <button onclick="ownerUnlock()">🔓 Alles freischalten</button>
 <button onclick="ownerAge()">🎂 Alter setzen</button>
 <button onclick="ownerViews()">👁️ +1 Milliarde Views</button>
 <button onclick="ownerSubs()">👥 +1 Milliarde Abos</button>
 <button onclick="ownerLikes()">❤️ +1 Milliarde Likes</button>
 </div>`;
}
window.ownerLogin=ownerLogin;

function ownerMoney(){data.money+=1000000000;updateHUD()}
function ownerMax(){
 data.money=999999999999999;
 data.subs=999999999999999;
 data.likes=999999999999999;
 data.views=999999999999999;
 for(let k in data.skills)data.skills[k]=999;
 updateHUD();
 alert("Alles maximiert!");
}
function ownerUnlock(){
 data.channels=999999;
 for(let i=1;i<=40;i++)if(!data.homes.includes("Luxushaus "+i))data.homes.push("Luxushaus "+i);
 alert("Alles freigeschaltet!");
}
function ownerAge(){
 let a=prompt("Alter:",data.age);
 if(a!==null)data.age=Math.max(0,parseInt(a)||data.age);
 updateHUD();
}
function ownerViews(){data.views+=1000000000;updateHUD()}
function ownerSubs(){data.subs+=1000000000;updateHUD()}
function ownerLikes(){data.likes+=1000000000;updateHUD()}
window.ownerMoney=ownerMoney;
window.ownerMax=ownerMax;
window.ownerUnlock=ownerUnlock;
window.ownerAge=ownerAge;
window.ownerViews=ownerViews;
window.ownerSubs=ownerSubs;
window.ownerLikes=ownerLikes;

/* SPEICHERN */
function saveGame(){
 localStorage.setItem("youtuberLifeSave",JSON.stringify(data));
 alert("Spiel gespeichert! 💾");
}
window.saveGame=saveGame;

function loadGame(){
 let s=localStorage.getItem("youtuberLifeSave");
 if(!s)return alert("Kein Spielstand gefunden.");
 data=JSON.parse(s);
 updateHUD();
 alert("Spielstand geladen! 📂");
}
window.loadGame=loadGame;

/* JOYSTICK */
const joy=document.getElementById("joy");
const stick=document.getElementById("stick");
let joyX=0,joyY=0,drag=false;

joy.addEventListener("pointerdown",e=>{
 drag=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});

joy.addEventListener("pointermove",e=>{
 if(drag)moveJoy(e);
});

joy.addEventListener("pointerup",()=>{
 drag=false;
 joyX=0;joyY=0;
 stick.style.left="32px";
 stick.style.top="32px";
});

function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 let len=Math.hypot(x,y);
 let max=42;
 if(len>max){x=x/len*max;y=y/len*max}
 joyX=x/max;
 joyY=y/max;
 stick.style.left=(32+x)+"px";
 stick.style.top=(32+y)+"px";
}

/* KEYBOARD */
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* KAMERA */
let firstPerson=false;

function toggleCamera(){
 firstPerson=!firstPerson;
}
window.toggleCamera=toggleCamera;

function animate(){
 requestAnimationFrame(animate);

 let dx=joyX;
 let dz=joyY;

 if(keys.w||keys.arrowup)dz=-1;
 if(keys.s||keys.arrowdown)dz=1;
 if(keys.a||keys.arrowleft)dx=-1;
 if(keys.d||keys.arrowright)dx=1;

 const speed=.11;
 player.position.x+=dx*speed;
 player.position.z+=dz*speed;

 if(Math.abs(dx)+Math.abs(dz)>.05){
  player.rotation.y=Math.atan2(dx,dz);
 }

 if(firstPerson){
  const target=new THREE.Vector3(
   player.position.x,
   player.position.y+2.5,
   player.position.z
  );
  camera.position.copy(target);
  const dir=new THREE.Vector3(0,0,-1);
  dir.applyQuaternion(player.quaternion);
  camera.lookAt(target.clone().add(dir.multiplyScalar(8)));
 }else{
  const offset=new THREE.Vector3(0,4.5,8);
  offset.applyQuaternion(player.quaternion);
  camera.position.lerp(
   player.position.clone().add(offset),
   .12
  );
  camera.lookAt(
   player.position.x,
   player.position.y+1.4,
   player.position.z
  );
 }

 renderer.render(scene,camera);
}

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

updateHUD();

setTimeout(()=>{
 document.getElementById("loading").style.display="none";
},900);

animate();
</script>
</body>
</html>
